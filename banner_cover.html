<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Banner - SaaS Starter Kit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0b0f19; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .banner {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            border: 2px solid #312e81;
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 60px 80px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            right: -100px;
            pointer-events: none;
        }
        .header { display: flex; align-items: center; justify-content: space-between; z-index: 2; }
        .logo { font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
        .logo span { color: #818cf8; }
        .tag { background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; color: #a5b4fc; padding: 8px 18px; border-radius: 999px; font-size: 16px; font-weight: 600; }
        .content { z-index: 2; margin-top: -20px; }
        .title { font-size: 56px; font-weight: 900; color: #ffffff; line-height: 1.15; margin-bottom: 20px; letter-spacing: -1px; }
        .title span { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .desc { font-size: 24px; color: #94a3b8; max-width: 850px; line-height: 1.4; }
        .footer { display: flex; align-items: center; gap: 40px; z-index: 2; border-top: 1px solid #1e293b; padding-top: 30px; }
        .pill { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 600; color: #e2e8f0; }
        .pill-icon { background: #312e81; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    </style>
</head>
<body>
    <div class="banner">
        <div class="glow"></div>
        <div class="header">
            <div class="logo">⚡ SaaS<b>Kita</b> <span>Starter Kit</span></div>
            <div class="tag">🚀 Production Ready</div>
        </div>
        <div class="content">
            <div class="title">Luncurkan SaaS Lokal Berbayar <span>Dalam 1 Jam</span></div>
            <div class="desc">Boilerplate Python Flask lengkap: Otentikasi Pengguna, Database SQLite Instan, dan Pembayaran QRIS Otomatis via Pakasir.</div>
        </div>
        <div class="footer">
            <div class="pill"><div class="pill-icon">💳</div> QRIS Real-Time Webhook</div>
            <div class="pill"><div class="pill-icon">🔒</div> Auth & Member Dashboard</div>
            <div class="pill"><div class="pill-icon">⚡</div> Zero-Config SQLite</div>
            <div class="pill"><div class="pill-icon">📦</div> Deploy VPS 1-Click</div>
        </div>
    </div>
</body>
</html>
